    class BootScene extends Phaser.Scene {
      constructor() {
        super({ key: "BootScene" });
      }

      preload() {}

      create() {
        const keys = Object.keys(ASSETS);
        let loaded = 0;

        const onAdd = () => {
          loaded++;
          if (loaded === keys.length) {
            this.textures.off('addtexture', onAdd);
            this.scene.start('TitleScene');
          }
        };

        this.textures.on('addtexture', onAdd);
        keys.forEach((key) => this.textures.addBase64(key, ASSETS[key]));
      }
    }

    class TitleScene extends Phaser.Scene {
      constructor() {
        super({ key: 'TitleScene' });
      }

      preload() {}

      create() {
        const width = this.game.config.width;
        const height = this.game.config.height;

        this.add.tileSprite(0, height / 2, 0, 0, 'background');

        this.add.text(width / 2, 50, "ROOTBEER FLOAT", {
          font: 'bold 20px Arial',
          color: '#ffffff',
          stroke: '#000000',
          strokeThickness: 4,
          align: 'center'
        }).setOrigin(0.5);

        this.add.text(width / 2, 100, 'Choose your player', {
          font: '13px Arial',
          color: '#ffffff',
          stroke: '#000000',
          strokeThickness: 3
        }).setOrigin(0.5);

        const roster = [
          { key: 'player', label: 'The Holden' },
          { key: 'matt', label: 'Matt' },
          { key: 'jen', label: 'Jen' },
          { key: 'david', label: 'David' },
          { key: 'pete', label: 'Pete' },
          { key: 'tom', label: 'Tom' },
          { key: 'chris', label: 'Chris' }
        ];

        if (!GameState.selectedSprite) {
          GameState.selectedSprite = 'player';
        }

        const cols = 3;
        const colSpacing = 80;
        const rowSpacing = 74;
        const startY = 160;
        const totalRows = Math.ceil(roster.length / cols);

        this.selectionBoxes = {};

        roster.forEach((entry, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const itemsInRow = (row === totalRows - 1)
            ? roster.length - row * cols
            : cols;
          const rowStartX = width / 2 - (colSpacing * (itemsInRow - 1)) / 2;
          const x = rowStartX + col * colSpacing;
          const y = startY + row * rowSpacing;

          const box = this.add.rectangle(x, y, 50, 50)
            .setStrokeStyle(2, 0xffffff, 0.6);

          this.add.image(x, y, entry.key).setScale(1.15);

          this.add.text(x, y + 32, entry.label, {
            font: '9px Arial',
            color: '#ffffff',
            stroke: '#000000',
            strokeThickness: 2
          }).setOrigin(0.5);

          this.add.zone(x, y, 54, 64)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => {
              GameState.selectedSprite = entry.key;
              this.updateSelection();
            });

          this.selectionBoxes[entry.key] = box;
        });

        this.updateSelection();

        this.add.text(width / 2, height - 60, 'START', {
          font: 'bold 18px Arial',
          color: '#222222',
          backgroundColor: '#ffe066',
          padding: { x: 18, y: 8 }
        })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.startGame());

        this.input.keyboard.on('keydown-SPACE', () => this.startGame());
      }

      updateSelection() {
        Object.entries(this.selectionBoxes).forEach(([key, box]) => {
          const selected = key === GameState.selectedSprite;
          box.setStrokeStyle(selected ? 3 : 2, selected ? 0xffd700 : 0xffffff, selected ? 1 : 0.6);
        });
      }

      startGame() {
        this.scene.start('GameScene');
      }
    }

    class GameScene extends Phaser.Scene {
      constructor() {
        super({ key: 'GameScene' });
      }

      preload() {}

      async create() {
        // Add background
        this.background = this.add.tileSprite(0, 240, 0, 0, 'background');


        // Create player
        GameState.player = this.physics.add.sprite(50, 240, GameState.selectedSprite || 'player').setOrigin(0, 0);


        // Create groups
        GameState.towers = this.physics.add.group();
        GameState.beers = this.physics.add.group();

        // Input
        this.input.on('pointerdown', () => this.jump());
        this.input.keyboard.on('keydown-SPACE', () => this.jump());

        // Pause Button
        this.add.text(250, 450, 'Pause', { font: '15px Arial', color: 'white' })
          .setInteractive()
          .setDepth(1)
          .on('pointerdown', () => {
            GameState.scenePaused = true;
            this.scene.pause();
            this.scene.launch('PauseScene');
          });

              this.input.keyboard.on('keydown-ESC', () => {
            this.scene.start('TitleScene');

        });

        // Reset high score (Ctrl+Shift+R)
        this.input.keyboard.on('keydown-R', async (event) => {
          if (event.ctrlKey && event.shiftKey) {
            event.preventDefault();
            GameState.topScore = 0;
            this.topScoreText.setText('BEST: 0');
            await this.setCookie('score', 0, 7);
          }
        });

        // Score
        GameState.score = 0;
        GameState.topScore = parseInt(await this.getCookie('score')) || 0;

        this.scoreText = this.add.text(10, 10, 'SCORE: 0', {
          font: '15px Arial',
          fill: 'white',
          backgroundColor: 'black'
        }).setDepth(1);

        this.topScoreText = this.add.text(10, 27, 'BEST: ' + GameState.topScore, {
          font: '15px Arial',
          fill: 'white',
          backgroundColor: 'black'
        }).setDepth(1);

        this.previousScoreText = this.add.text(10, 44, 'LAST: ' + GameState.previousScore, {
          font: '15px Arial',
          fill: 'white',
          backgroundColor: 'black'
        }).setDepth(1);

        // Award badges (reset each run, persist once shown until the run ends)
        this.previousAward = null;
        this.highScoreAward = null;

        // Collisions
        this.physics.add.collider(GameState.player, GameState.towers, () => {
          GameState.gameOver = true;
        }, null, this);

        this.physics.add.overlap(GameState.player, GameState.beers, () => {
          const beer = GameState.beers.getFirstAlive();
          if (beer) {
            beer.destroy();
            GameState.score += 1;
            this.scoreText.setText('SCORE: ' + GameState.score);

            if (!this.previousAward && GameState.previousScore > 0 && GameState.score > GameState.previousScore) {
              this.previousAward = this.showAward('PAST LAST RUN!', 0);
            }

            if (!this.highScoreAward && GameState.topScore > 0 && GameState.score > GameState.topScore) {
              this.highScoreAward = this.showAward('NEW HIGH SCORE!', 1);
            }
          }
        });

        // Spawn towers and beer
        this.time.addEvent({
          delay: 1500,
          callback: this.spawn,
          callbackScope: this,
          loop: true,
        });
      }

      update() {
        if (GameState.gameOver) {
          GameState.gameOver = false;
          // Save current score as previous score before restarting
          GameState.previousScore = GameState.score;
          this.setCookie('score', Math.max(GameState.score, GameState.topScore), 7).then(() => {
            this.scene.restart();
          });
        }

        const playerBounds = GameState.player.getBounds();
        if (playerBounds.bottom >= this.game.config.height || playerBounds.top <= 0) {
          GameState.gameOver = true;
        }

        this.background.tilePositionX += .7 ;
      }

      jump() {
        if (GameState.player) {
          GameState.player.setVelocityY(-300);
        }
      }

      // slot 0 = left (PAST LAST RUN!), slot 1 = to its right (NEW HIGH SCORE!)
      // Badge slides up into place, stays for 5s, then slides back out and is destroyed.
      showAward(text, slot) {
        const height = this.game.config.height;
        const restX = 44 + slot * 80;
        const restY = height - 46;

        const container = this.add.container(restX, height + 40).setDepth(20);

        const badge = this.add.image(0, 0, 'award').setScale(1.8);
        const label = this.add.text(0, 0, text, {
          font: 'bold 8px Arial',
          color: '#3a2a00',
          align: 'center',
          wordWrap: { width: 56 }
        }).setOrigin(0.5);

        container.add([badge, label]);

        this.tweens.add({
          targets: container,
          y: restY,
          duration: 350,
          ease: 'Back.Out'
        });

        this.time.delayedCall(5000, () => {
          this.tweens.add({
            targets: container,
            y: height + 40,
            alpha: 0,
            duration: 350,
            ease: 'Back.In',
            onComplete: () => container.destroy()
          });
        });

        return container;
      }

      spawn() {
        const gap = 160;
        const towerY = Phaser.Math.Between(75, 420 - gap);

        const upper = GameState.towers.create(350, towerY - gap / 2, 'tower').setOrigin(0, 1).setScale(1);
        const lower = GameState.towers.create(350, towerY + gap / 2, 'tower').setOrigin(0, 0).setScale(1);
        const beer = GameState.beers.create(382, towerY, 'beer');

        [upper, lower, beer].forEach(obj => {
          obj.body.setVelocityX(-250-(GameState.score*2));
          obj.body.setAllowGravity(false);
        });
      }

      async hashValue(value) {
        // Create a hash of the value combined with a secret salt
        const secret = 'flappy-beer-secret-2024'; // This provides some obfuscation
        const text = value + secret;
        const msgBuffer = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
      }

      async setCookie(name, value, days) {
        const hash = await this.hashValue(value.toString());
        const signedValue = value + '.' + hash;
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        const expires = "expires=" + date.toUTCString();
        document.cookie = name + "=" + signedValue + ";" + expires + ";path=/";
      }

      async getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for(let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === ' ') c = c.substring(1);
          if (c.indexOf(nameEQ) === 0) {
            const signedValue = c.substring(nameEQ.length, c.length);
            const parts = signedValue.split('.');
            if (parts.length !== 2) return null;

            const value = parts[0];
            const hash = parts[1];
            const expectedHash = await this.hashValue(value);

            // Verify the hash matches
            if (hash === expectedHash) {
              return value;
            } else {
              // Hash doesn't match - cookie was tampered with
              console.warn('Score cookie integrity check failed - resetting score');
              return null;
            }
          }
        }
        return null;
      }
    }

    class PauseScene extends Phaser.Scene {
      constructor() {
        super({ key: 'PauseScene' });
      }

      preload() {}

      create() {
        const width = this.game.config.width;
        const height = this.game.config.height;

        this.add.rectangle(width / 2, height / 2, width, height, 0x000000, 0.55);

        this.add.text(width / 2, height / 2 - 70, 'PAUSED', {
          font: 'bold 22px Arial',
          color: '#ffffff',
          stroke: '#000000',
          strokeThickness: 4
        }).setOrigin(0.5);

        this.add.text(width / 2, height / 2, 'RESUME', {
          font: 'bold 16px Arial',
          color: '#222222',
          backgroundColor: '#ffe066',
          padding: { x: 20, y: 10 }
        })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.resumeGame());

        this.add.text(width / 2, height / 2 + 60, 'CHARACTER SELECT', {
          font: 'bold 14px Arial',
          color: '#222222',
          backgroundColor: '#ffffff',
          padding: { x: 16, y: 8 }
        })
          .setOrigin(0.5)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.toTitle());

        this.input.keyboard.on('keydown-ESC', () => this.toTitle());
      }

      resumeGame() {
        GameState.scenePaused = false;
        this.scene.stop();
        this.scene.resume('GameScene');
      }

      toTitle() {
        GameState.scenePaused = false;
        this.scene.stop();
        this.scene.stop('GameScene');
        this.scene.start('TitleScene');
      }
    }

    // Ensure the Phaser game is initialized correctly
    const config = {
      type: Phaser.AUTO,
      width: 320,
      height: 480,
      backgroundColor: '#222222',
      parent: 'game-container',
      scene: [BootScene, TitleScene, GameScene, PauseScene], // Ensure your scene names match
      scale: {
        mode: Phaser.Scale.FIT,
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 900 },
          debug: false
        }
      }
    };

    // Initialize the Phaser game instance
    const game = new Phaser.Game(config);

    // Global game state management
    const GameState = {
      scenePaused: false,
      gameOver: false,
      score: 0,
      topScore: 0,
      previousScore: 0,
      selectedSprite: null,
      player: null,
      towers: null,
      beers: null
    };
  </script>
</body>
